# GitHub Actions updates only. Python packages are pinned by constraints.txt and
# every bump there is deliberate, followed by `--selftest` on the built exe (see
# CLAUDE.md), so Dependabot does not propose pip updates. Known vulnerabilities in
# the pinned packages show up in the Security workflow instead.
#
# An actions PR that touches build-release.yml or migration-e2e.yml changes the
# release pipeline: run the release gate (dry-run build, then Installer migration
# scenarios) on its branch before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
