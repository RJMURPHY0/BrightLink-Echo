name: Build and publish Windows installer

# Publishes a signed release from EITHER path:
#   1. Pushing a version tag  (git tag vX.Y.Z && git push origin vX.Y.Z) — always builds.
#   2. Pushing a commit to main that bumps APP_VERSION — auto-builds when no
#      release for that version exists yet. This closes the gap where "push to
#      main" shipped code the auto-updater never saw (it checks GitHub Releases,
#      not commits), so the app kept reporting the old version as "up to date".
# A manual run (Run workflow) is a DRY RUN unless "publish" is ticked: it
# builds, signs and verifies, then keeps the exe as a 3-day workflow artifact.
# That is how signing gets tested without touching the live release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (unticked = dry run: build, sign, verify, keep the exe as an artifact)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # GitHub OIDC login to Azure for signing; no stored secret

jobs:
  # Cheap gate (seconds on Linux) so an ordinary main push with no version bump
  # doesn't spin up the heavy Windows build. Outputs the version + a go/no-go.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.GO }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"(.+?)\"', open('app.py').read()).group(1))")
          echo "APP_VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Explicit tag push or manual dispatch always builds.
          if [[ "${GITHUB_REF}" == refs/tags/* || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Explicit release trigger (${GITHUB_EVENT_NAME} ${GITHUB_REF})."
            echo "GO=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch push: build only if this version has no published release yet.
          # Checking the RELEASE (not just the tag) means a previously FAILED
          # build self-heals on the next push instead of being locked out.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already published — nothing to do."
            echo "GO=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet — building and publishing."
            echo "GO=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: windows-latest
    # The Azure federated credential trusts this environment, whatever the
    # trigger. Its deployment rule must allow main AND v* tags, or a tag
    # re-cut silently loses signing (docs/CODE_SIGNING.md).
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv installs the heavy wheels (ctranslate2, onnxruntime, numpy…) in
      # parallel and keeps them in a cross-run cache — dependency install drops
      # from minutes to seconds on warm builds.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            constraints.txt

      # -c constraints.txt pins every package (PyInstaller included) to a build
      # proven in use. Unpinned, v1.6.79 silently took onnxruntime 1.30.0.
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt pyinstaller -c constraints.txt

      - name: Prepare build-time config (no secrets)
        shell: pwsh
        run: Copy-Item "config_default.json" "config.json" -Force

      # Names come from brand.py. DIST_EXE and UPDATE_ASSET are frozen;
      # PRODUCT_NAME and DOWNLOAD_ASSET follow the product name.
      - name: Read version and product names
        id: version
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'APP_VERSION = \x22(.+?)\x22', open('app.py').read()).group(1))"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          python -c "import brand; print('PRODUCT_NAME=' + brand.PRODUCT_NAME); print('DIST_EXE=' + brand.EXE_BASENAME + '.exe'); print('DOWNLOAD_ASSET=' + brand.DOWNLOAD_ASSET); print('UPDATE_ASSET=' + brand.UPDATE_ASSET)" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: pyinstaller --noconfirm --clean "ftc_whisper.spec"

      # ── Code signing via Azure Artifact Signing ───────────────────────────
      # Configured by five repo variables (docs/CODE_SIGNING.md); none is a
      # secret, because the login is GitHub OIDC. All five set: sign. None set:
      # build unsigned with a warning, unless REQUIRE_SIGNING is 'true', which
      # is switched on once signing is proven and then refuses unsigned builds.
      # Some but not all set: fail, because that is a mistake, not a choice.
      - name: Decide whether to sign
        id: signing
        shell: pwsh
        env:
          V_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          V_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          V_SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          V_SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          V_SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: |
          $names = @('V_AZURE_CLIENT_ID', 'V_AZURE_TENANT_ID',
                     'V_SIGNING_ENDPOINT', 'V_SIGNING_ACCOUNT', 'V_SIGNING_PROFILE')
          $set = @($names | Where-Object { [Environment]::GetEnvironmentVariable($_) })
          if ($set.Count -eq $names.Count) {
            echo "ENABLED=true" >> $env:GITHUB_OUTPUT
            Write-Host "Signing is configured."
            exit 0
          }
          if ($set.Count -gt 0) {
            $missing = ($names | Where-Object { $set -notcontains $_ } | ForEach-Object { $_.Substring(2) }) -join ', '
            throw "Signing is only partly configured. Missing repo variables: $missing"
          }
          if ($env:REQUIRE_SIGNING -eq 'true') {
            throw "REQUIRE_SIGNING is on but no signing variables are set: refusing to build an unsigned release."
          }
          echo "ENABLED=false" >> $env:GITHUB_OUTPUT
          Write-Host "::warning title=Unsigned build::Signing is not configured, so this exe is UNSIGNED. See docs/CODE_SIGNING.md."

      - name: Azure login (GitHub OIDC)
        if: ${{ steps.signing.outputs.ENABLED == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The signing identity only holds a role on the signing account, not
          # on a subscription, and signing needs no subscription context.
          allow-no-subscriptions: true

      # Signs dist\FTC Whisper.exe in place. The action uses the Azure CLI
      # session from the login step above (exclude-azure-cli-credential
      # defaults to false), so no client secret exists anywhere.
      - name: Sign executable (Azure Artifact Signing)
        if: ${{ steps.signing.outputs.ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ${{ steps.version.outputs.PRODUCT_NAME }}

      # Two names, one signed build (a copy keeps the embedded signature):
      #   UPDATE_ASSET    what every installed updater, and the CRM's download
      #                   button, fetch. Frozen: never rename it.
      #   DOWNLOAD_ASSET  what people download; follows the product name.
      - name: Name the release assets
        shell: pwsh
        env:
          DIST_EXE: ${{ steps.version.outputs.DIST_EXE }}
          UPDATE_ASSET: ${{ steps.version.outputs.UPDATE_ASSET }}
          DOWNLOAD_ASSET: ${{ steps.version.outputs.DOWNLOAD_ASSET }}
        run: |
          Copy-Item "dist\$env:DIST_EXE" "dist\$env:UPDATE_ASSET" -Force
          if ($env:DOWNLOAD_ASSET -ne $env:UPDATE_ASSET) {
            Copy-Item "dist\$env:DIST_EXE" "dist\$env:DOWNLOAD_ASSET" -Force
          }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "$($_.Name)  $((Get-FileHash $_.FullName).Hash)" }

      - name: Verify signature
        if: ${{ steps.signing.outputs.ENABLED == 'true' }}
        shell: pwsh
        env:
          UPDATE_ASSET: ${{ steps.version.outputs.UPDATE_ASSET }}
          DOWNLOAD_ASSET: ${{ steps.version.outputs.DOWNLOAD_ASSET }}
        run: |
          foreach ($f in @("dist\$env:UPDATE_ASSET", "dist\$env:DOWNLOAD_ASSET")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f  status: $($sig.Status)  signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Signature invalid on ${f}: $($sig.Status)" }
          }

      # ── VirusTotal scan ───────────────────────────────────────────────────
      # Uploads the release exe to VirusTotal and prints the analysis URL so you
      # can see the AV detection rate on every build BEFORE users do. Gated on a
      # free VT_API_KEY repo secret; skipped if absent. Purely informational —
      # never fails the build.
      - name: Scan with VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/${{ steps.version.outputs.DOWNLOAD_ASSET }}

      - name: Keep the build for inspection (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-v${{ steps.version.outputs.VERSION }}
          path: dist/${{ steps.version.outputs.DOWNLOAD_ASSET }}
          retention-days: 3

      - name: Publish versioned release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.PRODUCT_NAME }} v${{ steps.version.outputs.VERSION }}
          prerelease: false
          make_latest: true
          files: |
            dist/${{ steps.version.outputs.UPDATE_ASSET }}
            dist/${{ steps.version.outputs.DOWNLOAD_ASSET }}
          overwrite_files: true
          generate_release_notes: true
