name: Installer migration scenarios

# Proves the onefile -> installed-layout migration, and the v1.8.5 move from
# the legacy folder names to the current ones, on clean Windows machines,
# with the REAL signed files of a "Build and publish Windows installer" dry
# run (Run workflow, publish unticked). Each job is a fresh VM: it installs
# old releases from GitHub, points api.github.com/github.com at a local fake
# (tools/fake_release_server.py) serving the dry run, and lets each version's
# own updater do the work. Nothing is ever published, and no live client can
# see any of it.
#
# Inputs are run ids: the number at the end of the dry run's URL
# (.../actions/runs/<id>). next_run_id is a second dry run built at a HIGHER
# version (from a throwaway branch), for the onedir -> onedir update; leave it
# empty to skip that job.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of the dry run to test"
        required: true
      next_run_id:
        description: "Run id of a dry run at a higher version (optional)"
        required: false
        default: ""
      from_versions:
        description: "Old releases to upgrade from (JSON list)"
        required: false
        default: '["1.7.2", "1.6.86", "1.6.79"]'
      installed_from:
        description: "Installed-layout releases (legacy folder names) to update from (JSON list)"
        required: false
        default: '["1.8.0", "1.8.4"]'

permissions:
  contents: read
  actions: read

jobs:
  upgrade:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(inputs.from_versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0        # old releases' updater code comes from their tags
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - run: uv pip install --system -r requirements.txt -c constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      # The model is fetched once, like the app does, so the scenario can
      # prove an update never re-downloads it.
      # Saved from wherever the model ends up (the current folder, once the
      # scenario has moved the machine); seed-model puts it back in the legacy
      # folder, where the old version being upgraded expects it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~\AppData\Local\BrightLink Echo\models
            ~\AppData\Local\FTC Whisper\models
          key: parakeet-${{ hashFiles('asr_engine.py') }}
      - run: python tools/e2e_upgrade.py seed-model
      - run: python tools/e2e_upgrade.py upgrade --from ${{ matrix.from }} --assets dist --report report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-upgrade-from-${{ matrix.from }}
          path: report/

  installed:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(inputs.installed_from) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - run: uv pip install --system -r requirements.txt -c constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      # Saved from wherever the model ends up (the current folder, once the
      # scenario has moved the machine); seed-model puts it back in the legacy
      # folder, where the old version being upgraded expects it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~\AppData\Local\BrightLink Echo\models
            ~\AppData\Local\FTC Whisper\models
          key: parakeet-${{ hashFiles('asr_engine.py') }}
      - run: python tools/e2e_upgrade.py seed-model
      - run: python tools/e2e_upgrade.py installed --from ${{ matrix.from }} --assets dist --report report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-installed-from-${{ matrix.from }}
          path: report/

  faults:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - run: uv pip install --system -r requirements.txt -c constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      # Saved from wherever the model ends up (the current folder, once the
      # scenario has moved the machine); seed-model puts it back in the legacy
      # folder, where the old version being upgraded expects it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~\AppData\Local\BrightLink Echo\models
            ~\AppData\Local\FTC Whisper\models
          key: parakeet-${{ hashFiles('asr_engine.py') }}
      - run: python tools/e2e_upgrade.py seed-model
      - run: python tools/e2e_upgrade.py faults --assets dist --report report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-faults
          path: report/

  next:
    if: ${{ inputs.next_run_id != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - run: uv pip install --system -r requirements.txt -c constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.next_run_id }}
          github-token: ${{ github.token }}
          path: dist-next
          merge-multiple: true
      # Saved from wherever the model ends up (the current folder, once the
      # scenario has moved the machine); seed-model puts it back in the legacy
      # folder, where the old version being upgraded expects it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~\AppData\Local\BrightLink Echo\models
            ~\AppData\Local\FTC Whisper\models
          key: parakeet-${{ hashFiles('asr_engine.py') }}
      - run: python tools/e2e_upgrade.py seed-model
      - run: python tools/e2e_upgrade.py next --assets dist --next-assets dist-next --report report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-next
          path: report/
