# XcodeGen spec for BrightLink Echo for iPhone.
# The .xcodeproj is generated (never committed): `cd ios && xcodegen generate`.
# CI (.github/workflows/ios.yml) does the same on a macOS runner.
#
# Identifiers below are PERMANENT once the first build reaches App Store
# Connect (bundle IDs, App Group, URL scheme). Change them only before that.
name: BrightLinkEcho

options:
  bundleIdPrefix: io.brightlink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(ECHO_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    ECHO_APP_BUNDLE_ID: io.brightlink.echo
    ECHO_APP_GROUP: group.io.brightlink.echo
    ECHO_URL_SCHEME: brightlinkecho

packages:
  EchoCore:
    path: EchoCore
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.18.3"

targets:
  BrightLinkEcho:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: EchoCore
      - package: FluidAudio
      - target: EchoKeyboard
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Echo listens only while you dictate, then turns what you said into text in the app you are typing in."
        NSSpeechRecognitionUsageDescription: "Echo uses on-device speech recognition as a backup while its main speech model downloads."
        CFBundleURLTypes:
          - CFBundleURLName: io.brightlink.echo
            CFBundleURLSchemes:
              - $(ECHO_URL_SCHEME)
        EchoAppGroup: $(ECHO_APP_GROUP)
        EchoURLScheme: $(ECHO_URL_SCHEME)
    entitlements:
      path: App/BrightLinkEcho.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ECHO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ECHO_APP_BUNDLE_ID)
        PRODUCT_NAME: Echo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  EchoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    dependencies:
      - package: EchoCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EchoAppGroup: $(ECHO_APP_GROUP)
        EchoURLScheme: $(ECHO_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-GB
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/EchoKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ECHO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ECHO_APP_BUNDLE_ID).keyboard
        PRODUCT_NAME: EchoKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES

  EchoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BrightLinkEcho
      - package: EchoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ECHO_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echo.app/Echo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  BrightLinkEcho:
    build:
      targets:
        BrightLinkEcho: all
        EchoKeyboard: all
    test:
      targets:
        - EchoTests
